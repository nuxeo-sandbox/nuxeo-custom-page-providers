##-----------------------------------------------------------------------------
## Docker JVM Configuration
##-----------------------------------------------------------------------------

## When running Nuxeo in a Linux container, the JVM will automatically detect the cgroup memory limit with the
## UseContainerSupport option, enabled by default.
## By default, we set the heap size to a fixed size equal to 50% of the cgroup memory limit.
## This is achieved by using the same percentage for InitialRAM as for MaxRAM, resulting in equal Xms and Xmx which is recommended in production.
JAVA_OPTS=$JAVA_OPTS -XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=50

## embedding-example is one of the templates of this plugin: it enables knn on the search index
## and deploys a sample configuration (schema, mapping, UI). It works with both search clients.
nuxeo.append.templates.my=mongodb,embedding-example
nuxeo.mongodb.server=mongodb:27017

## Search: docker-compose starts one OpenSearch node and installs one search client package
## (OpenSearch 1 by default, see docker-compose.yml). Only the properties of the installed
## search client are used, the other ones are ignored.
# OpenSearch 1 (package nuxeo-search-client-opensearch1)
nuxeo.opensearch1.client.server=http://opensearch:9200
nuxeo.search.client.default.opensearch1.settings.numberOfShards=1
nuxeo.search.client.default.opensearch1.settings.numberOfReplicas=0
# OpenSearch 2 (package nuxeo-search-client-opensearch2)
nuxeo.opensearch2.client.server=http://opensearch:9200
nuxeo.search.client.default.opensearch2.settings.numberOfShards=1
nuxeo.search.client.default.opensearch2.settings.numberOfReplicas=0

nuxeo.selection.selectAllEnabled=true
