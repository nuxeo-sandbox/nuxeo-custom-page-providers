services:

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # OpenSearch 1 by default. For OpenSearch 2, set in .env (see the README):
  #   OPENSEARCH_IMAGE=opensearchproject/opensearch:2.19.7
  #   SEARCH_CLIENT_PACKAGE=nuxeo-search-client-opensearch2
  # and remove the os_data volume when switching (docker compose down -v).
  opensearch:
    image: ${OPENSEARCH_IMAGE:-opensearchproject/opensearch:1.3.20}
    hostname: opensearch
    restart: always
    healthcheck:
      test: curl -f http://opensearch:9200/
      interval: 2m
      timeout: 30s
      retries: 10
      start_period: 1m
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - cluster.name=opensearch
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    volumes:
      - os_data:/usr/share/opensearch/data

  nuxeo:
    image: nuxeo-custom-page-providers:${PLUGIN_VERSION:-2025.3.0-SNAPSHOT}
    env_file:
      - ./.env
    ports:
      - "8080:8080"
      - "8787:8787"
    environment:
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8787
      - NUXEO_DEV=true
      # The search client package must match the OpenSearch image above
      - NUXEO_PACKAGES=nuxeo-web-ui ${SEARCH_CLIENT_PACKAGE:-nuxeo-search-client-opensearch1} ${NUXEO_PACKAGES:-}
      - NUXEO_CLID=${NUXEO_CLID}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_CREDENTIAL_EXPIRATION=${AWS_CREDENTIAL_EXPIRATION}
      - AWS_REGION=${AWS_REGION}
    hostname: nuxeo
    restart: always
    depends_on:
      - mongodb
      - opensearch
    volumes:
      - ./conf.d:/etc/nuxeo/conf.d
      - nuxeo_data:/var/lib/nuxeo

volumes:
  nuxeo_data: {}
  os_data:
  mongodb_data:

